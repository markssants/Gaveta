<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 320px;
        padding: 14px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .link-btn {
        border: 0;
        background: none;
        padding: 4px 6px;
        border-radius: 6px;
        color: var(--muted);
        cursor: pointer;
        font-size: 12.5px;
      }
      .link-btn:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .current {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        min-width: 0;
      }
      .current img {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        flex: none;
      }
      .current div {
        min-width: 0;
      }
      .current strong,
      .current span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .current strong {
        font-size: 13.5px;
      }
      .stack {
        display: grid;
        gap: 8px;
      }
      .opts {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        display: grid;
        gap: 6px;
      }
      #setup {
        display: grid;
        gap: 10px;
      }
      #setup p {
        margin: 0;
      }
      .folder {
        display: grid;
        gap: 4px;
        margin-bottom: 10px;
      }
      .folder-row {
        display: flex;
        gap: 6px;
      }
      .btn.mini {
        width: auto;
        height: 36px;
        padding: 0 10px;
        font-size: 13px;
        white-space: nowrap;
      }
      .new-folder {
        display: grid;
        gap: 6px;
        margin-top: 6px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .new-folder input[type='text'] {
        height: 34px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        outline: 0;
      }
      .new-folder input[type='text']:focus {
        border-color: var(--accent);
      }
      .folder select {
        width: 100%;
        height: 36px;
        padding: 0 8px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }
      .edit-first {
        justify-self: center;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><img src="icons/48.png" alt="" /> Gaveta</div>
      <div>
        <button class="link-btn" id="open" title="Abrir o Gaveta">Abrir</button>
        <button class="link-btn" id="settings" title="Configurações">⚙︎</button>
      </div>
    </header>

    <section id="setup" hidden>
      <p>Primeiro diga onde está o seu Gaveta (o endereço do site no Vercel).</p>
      <button class="btn primary" id="goSetup">Configurar</button>
    </section>

    <section id="main" hidden>
      <div class="current" id="current">
        <img id="favicon" alt="" />
        <div>
          <strong id="title"></strong>
          <span class="muted small" id="host"></span>
        </div>
      </div>
      <div class="folder">
        <span class="muted small">Guardar em</span>
        <div class="folder-row">
          <select id="folder" aria-label="Guardar em"></select>
          <button class="btn mini" id="newFolderBtn" title="Nova gaveta ou subpasta" aria-expanded="false">+ Nova</button>
        </div>
        <div id="newFolder" class="new-folder" hidden>
          <input type="text" id="newFolderName" placeholder="Nome da nova gaveta" maxlength="40" />
          <label class="check small" id="asSubRow"><input type="checkbox" id="asSub" /> <span id="asSubLabel"></span></label>
          <span class="muted small">Ela é criada quando você guardar.</span>
        </div>
      </div>
      <p class="muted small" id="folderHint" hidden style="margin: -4px 0 10px">Abra o Gaveta uma vez para carregar suas gavetas aqui.</p>
      <div class="stack">
        <button class="btn primary" id="saveOne">Guardar esta aba</button>
        <button class="btn" id="saveAll">Guardar todas as abas desta janela</button>
        <button class="link-btn edit-first" id="editFirst">Editar título e nota antes de guardar</button>
      </div>
      <div class="opts">
        <label class="check"><input type="checkbox" id="close" /> Fechar as abas depois de guardar</label>
        <p class="muted small" style="margin: 0">As abas só fecham depois que o Gaveta confirmar que gravou. Abas fixadas não entram em "todas".</p>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
